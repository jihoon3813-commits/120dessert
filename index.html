<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>120pie&coffee | 소상공인 카페 회생을 위한 하이브리드 리모델링</title>
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.length > 1 && path.slice(-1) === '/') {
          path = path.slice(0, -1);
        }
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        
        var cleanRoutes = ['/portal', '/admin', '/inquiry', '/stores'];
        if (cleanRoutes.indexOf(path) !== -1) {
          window.location.replace('/#' + path + search + hash);
        } else if (path.indexOf('/120dessert') === 0) {
          var subPath = path.substring(11);
          if (cleanRoutes.indexOf(subPath) !== -1) {
            window.location.replace('/120dessert/#' + subPath + search + hash);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
